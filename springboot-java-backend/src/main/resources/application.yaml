# Defaults live here, in one visible place. Every one of them is overridden by the same APP_*
# environment variable the zero-dependency service reads, through Spring's relaxed binding:
# APP_MAX_BODY_BYTES -> app.max-body-bytes, APP_AUTH_JWKS_URL -> app.auth.jwks-url, and so on.
app:
  host: 0.0.0.0
  port: 8080
  backlog: 0
  max-connections: 1000
  max-concurrent-requests: 256
  max-body-bytes: 1048576
  request-timeout-seconds: 30
  shutdown-grace-seconds: 20
  drain-delay-seconds: 5
  log-level: INFO
  max-tasks: 100000
  max-cubes: 100000
  idempotency-ttl-seconds: 86400
  max-idempotency-keys: 10000
  auth:
    # enabled is derived from the issuer by AuthEnabledEnvironmentPostProcessor; setting
    # APP_AUTH_ENABLED explicitly overrides that.
    issuer: ""
    audience: ""
    jwks-url: ""
    scope-prefix: "task-service:"
    realm: api
    jwks-ttl-seconds: 300
    jwks-min-refresh-seconds: 30
    jwks-timeout-seconds: 5
    jwks-max-stale-seconds: 3600
    jwks-max-bytes: 131072
    clock-leeway-seconds: 60
    max-token-bytes: 8192
  nautical-flags:
    default-interval-millis: 1000
    min-interval-millis: 50
    max-interval-millis: 60000
    max-text-length: 256
    max-duration-seconds: 300
    max-concurrent-streams: 100

spring:
  application:
    name: task-service
  threads:
    virtual:
      # Tomcat handles requests on virtual threads, as the sibling service does. Note that this
      # removes maxThreads as a concurrency bound, which is why LoadSheddingFilter exists.
      enabled: true
  main:
    banner-mode: off
  mvc:
    async:
      # No container timeout for async requests. Tomcat's default of 30 s would cut every
      # /v1/nautical-flags stream mid-flight; the stream bounds itself with
      # app.nautical-flags.max-duration-seconds instead.
      request-timeout: -1
  lifecycle:
    timeout-per-shutdown-phase: ${app.shutdown-grace-seconds}s

server:
  address: ${app.host}
  port: ${app.port}
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    max-connections: ${app.max-connections}
    accept-count: ${app.backlog}
    connection-timeout: ${app.request-timeout-seconds}s

management:
  endpoints:
    web:
      exposure:
        # /metrics and /health/* are served at their published paths by
        # OperationalEndpointsController; these are the canonical equivalents.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # Publishes /actuator/health/liveness and /actuator/health/readiness, and makes readiness the
      # thing graceful shutdown moves first.
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      # One JSON object per line on stdout, as the sibling service emits. MDC entries — requestId
      # and traceId — are included automatically, which is what makes RequestIdFilter enough.
      console: logstash
  level:
    root: INFO

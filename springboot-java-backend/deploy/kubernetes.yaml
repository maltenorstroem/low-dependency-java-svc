# Reference deployment. Adjust image, replicas and resources to your environment.
#
# Deliberately a near-copy of the sibling service's manifest, so that diffing the
# two shows exactly what running the same contract on Spring Boot costs an
# operator: more memory, a longer startup allowance, and nothing else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-task-service
  labels: { app.kubernetes.io/name: spring-task-service }
spec:
  replicas: 1 # in-memory store: scale out only after switching to a shared database
  selector:
    matchLabels: { app.kubernetes.io/name: spring-task-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: spring-task-service }
    spec:
      automountServiceAccountToken: false
      # > APP_DRAIN_DELAY_SECONDS + APP_SHUTDOWN_GRACE_SECONDS, so the app finishes draining first.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/your-org/spring-task-service:1.0.0
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: APP_DRAIN_DELAY_SECONDS, value: "5" }
            - { name: APP_SHUTDOWN_GRACE_SECONDS, value: "20" }
            # Setting the issuer turns authentication on. Remove these three and the service
            # starts unauthenticated (and says so at WARN on every boot). No Secret is needed:
            # a resource server holds only public keys.
            - { name: APP_AUTH_ISSUER, value: "https://idp.example.com/realms/demo" }
            - { name: APP_AUTH_AUDIENCE, value: "task-service" }
            - { name: APP_AUTH_JWKS_URL, value: "https://idp.example.com/realms/demo/protocol/openid-connect/certs" }
          resources:
            # 512Mi where the sibling asks for 256Mi. A Spring context, Tomcat and the AOT cache
            # do not fit comfortably in 256Mi, and MaxRAMPercentage=75 sizes the heap from this.
            requests: { cpu: 500m, memory: 512Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # The probe paths are the published ones, served by
          # OperationalEndpointsController. Actuator's own equivalents are
          # /actuator/health/liveness and /actuator/health/readiness.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 1
            # 60 where the sibling allows 30: startup is ~2s with the AOT cache against ~60ms,
            # and a cold node pulling a 191Mi image needs more slack than a 68Mi one.
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 2
            failureThreshold: 1
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: spring-task-service
spec:
  selector: { app.kubernetes.io/name: spring-task-service }
  ports:
    - { name: http, port: 80, targetPort: http }
